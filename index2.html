  <script>
    const CONFIG = {
      spreadsheetId: '17qPt1vJEMiE2I9SXRSHpPyyQFRJhwx2q0QWOGYRz3Oc',
      sheetName: 'data',
      teacherSheetName: '教員リスト'
    };

    let state = {
      baseDate: "",
      teachers: [],
      slots: [],
      zoom: 1.0,
      specialDays: [false, false, false, false, false, false],
      cDayTexts: ["", "", "", "", "", ""],
      hasSaturday: false,
      selectedTeacher: null,
      selectedRow: null
    };

    const REFRESH_INTERVAL_SECONDS = 900;
    let countdownTimer = null;
    let timeRemaining = REFRESH_INTERVAL_SECONDS;

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initBaseDate();
      fetchServerData();
      setupEventListeners();
      setupDragScroll();
    });

    /* 共通日付正規化関数 (8桁数値 YYYYMMDD へ確実に変換) */
    function parseDateTo8DigitKey(val) {
      if (!val) return '';
      const str = String(val).trim();

      // Date(2026,8,9) 形式
      const gvizMatch = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)/i);
      if (gvizMatch) {
        const y = gvizMatch[1];
        const m = String(parseInt(gvizMatch[2], 10) + 1).padStart(2, '0');
        const d = String(parseInt(gvizMatch[3], 10)).padStart(2, '0');
        return `${y}${m}${d}`;
      }

      // 2026/09/09, 2026-9-9 形式
      const partsMatch = str.match(/(\d{4})[\/\-\.\s年]?(\d{1,2})[\/\-\.\s月]?(\d{1,2})/);
      if (partsMatch) {
        const y = partsMatch[1];
        const m = String(parseInt(partsMatch[2], 10)).padStart(2, '0');
        const d = String(parseInt(partsMatch[3], 10)).padStart(2, '0');
        return `${y}${m}${d}`;
      }

      const digits = str.replace(/\D/g, '');
      if (digits.length === 8) return digits;
      return '';
    }

    function fetchSheetJsonp(sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
        
        window[callbackName] = function(json) {
          delete window[callbackName];
          const script = document.getElementById(callbackName);
          if (script) script.remove();
          
          if (!json || !json.table || !json.table.rows) {
            resolve([]);
            return;
          }
          
          const rows = json.table.rows.map(row => {
            if (!row.c) return [];
            return row.c.map(cell => {
              if (!cell) return "";
              if (cell.f !== null && cell.f !== undefined) return cell.f;
              if (cell.v !== null && cell.v !== undefined) return cell.v;
              return "";
            });
          });
          resolve(rows);
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.spreadsheetId}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
        script.onerror = (err) => {
          delete window[callbackName];
          if (script) script.remove();
          reject(err);
        };
        document.body.appendChild(script);
      });
    }

    function formatToJSTString(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const date = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${date}`;
    }

    function getMondayOfWeek(dateObj) {
      const targetDate = new Date(dateObj.getTime());
      const day = targetDate.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      targetDate.setDate(targetDate.getDate() + diffToMonday);
      return targetDate;
    }

    function initBaseDate() {
      const today = new Date();
      const day = today.getDay();
      let targetMonday = new Date(today);

      if (day >= 1 && day <= 5) {
        targetMonday = getMondayOfWeek(today);
      } else {
        const offset = day === 6 ? 2 : 1;
        targetMonday.setDate(today.getDate() + offset);
        targetMonday = getMondayOfWeek(targetMonday);
      }
      
      state.baseDate = formatToJSTString(targetMonday);
      document.getElementById("baseDate").value = state.baseDate;
    }

    function resetCountdownTimer() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
      }
      timeRemaining = REFRESH_INTERVAL_SECONDS;
      updateCountdownDisplay();

      countdownTimer = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          initBaseDate();
          fetchServerData();
        } else {
          updateCountdownDisplay();
        }
      }, 1000);
    }

    function updateCountdownDisplay() {
      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      const displayMins = String(mins).padStart(2, '0');
      const displaySecs = String(secs).padStart(2, '0');
      
      const countdownEl = document.getElementById("countdownText");
      if (countdownEl) {
        countdownEl.textContent = `${displayMins}:${displaySecs}`;
      }
    }

    async function fetchServerData() {
      showLoading(true);
      hideError();
      resetCountdownTimer();

      try {
        const [teacherRows, scheduleRows, cDayRows] = await Promise.all([
          fetchSheetJsonp(CONFIG.teacherSheetName),
          fetchSheetJsonp(CONFIG.sheetName),
          fetchSheetJsonp('C日課判定')
        ]);

        const cDayMap = {};
        if (Array.isArray(cDayRows)) {
          cDayRows.forEach(row => {
            const rawDateStr = String(row[0] || "").trim();
            const textVal = String(row[3] || "").trim();
            const dateKey = parseDateTo8DigitKey(rawDateStr);
            if (dateKey && textVal) {
              cDayMap[dateKey] = textVal;
            }
          });
        }

        const rawTeacherList = teacherRows
          .map(row => String(row[0] || "").trim())
          .filter(name => name.length > 0);

        const headerKeywords = ["教員", "名前", "氏名", "教員名", "担当", "teacher", "name"];
        const teacherList = (rawTeacherList.length > 0 && headerKeywords.some(kw => rawTeacherList[0].toLowerCase().includes(kw)))
          ? rawTeacherList.slice(1)
          : rawTeacherList;

        const dataRows = (scheduleRows.length > 0 && String(scheduleRows[0][3] || "").includes("時限")) 
          ? scheduleRows.slice(1) 
          : scheduleRows;

        const masterData = dataRows.map(row => {
          const starMark = String(row[1] || "").trim();
          const dateVal  = String(row[2] || "").trim();
          const colD     = String(row[3] || "").trim();
          const className= String(row[4] || "").trim();
          const subject  = String(row[5] || "").trim();
          const teachers = row.slice(11, 26).map(t => String(t || "").trim()).filter(Boolean);

          const periodMatch = colD.match(/\d+/);
          const period = periodMatch ? parseInt(periodMatch[0]) : null;

          return {
            dateKey: parseDateTo8DigitKey(dateVal),
            period: period,
            className: className,
            subject: subject,
            teachers: teachers,
            hasStar: starMark === "☆",
            isC: colD.startsWith("C")
          };
        }).filter(item => item.dateKey && item.period);

        const baseMonday = new Date(state.baseDate.replace(/-/g, '/'));
        const weekDates = [];
        const specialDays = [false, false, false, false, false, false];
        const cDayTexts = ["", "", "", "", "", ""];

        for (let d = 0; d < 6; d++) {
          const target = new Date(baseMonday);
          target.setDate(baseMonday.getDate() + d);
          
          const yyyy = target.getFullYear();
          const mm = String(target.getMonth() + 1).padStart(2, '0');
          const dd = String(target.getDate()).padStart(2, '0');
          const key = `${yyyy}${mm}${dd}`;
          weekDates.push(key);

          // C日課判定シートのD列（index 3）テキストのみを採用
          if (cDayMap[key]) {
            cDayTexts[d] = cDayMap[key];
          }
        }

        const slots = [];
        for (let d = 0; d < 6; d++) {
          const key = weekDates[d];
          const dayMatches = masterData.filter(item => item.dateKey === key);

          // 後ろの行（最新）を優先してマトリクスを構成
          dayMatches.forEach(item => {
            item.teachers.forEach(teacherName => {
              // 同一（日・時限・教員）のデータが既に存在する場合は上書き更新
              const existingIdx = slots.findIndex(s => s.day === d && s.period === item.period && s.teacher === teacherName);
              const slotItem = {
                day: d,
                period: item.period,
                teacher: teacherName,
                class: item.className,
                subject: item.subject,
                hasStar: item.hasStar
              };
              if (existingIdx !== -1) {
                slots[existingIdx] = slotItem;
              } else {
                slots.push(slotItem);
              }
            });
          });
        }

        const hasSatData = slots.some(s => s.day === 5);

        state.teachers = teacherList.length > 0 ? teacherList : Array.from(new Set(slots.map(s => s.teacher)));
        state.slots = slots;
        state.specialDays = specialDays;
        state.cDayTexts = cDayTexts;
        state.hasSaturday = hasSatData;
        showLoading(false);
        render();

      } catch (err) {
        console.error("Data Load Error:", err);
        showLoading(false);
        showError("スプレッドシートデータの取得に失敗しました。接続を確認してください。");
      }
    }

    function showLoading(isLoading) {
      const overlay = document.getElementById("loadingOverlay");
      if (isLoading) {
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function showError(msg) {
      const alert = document.getElementById("errorAlert");
      const text = document.getElementById("errorMessage");
      const indicator = document.getElementById("syncIndicator");
      
      text.textContent = msg;
      alert.classList.remove("hidden");

      indicator.className = "flex items-center gap-1 px-2 py-0.5 bg-red-600/30 border border-red-500/30 rounded-md text-red-200 text-[9px] font-semibold ml-2";
      indicator.innerHTML = `<span class="w-1 h-1 rounded-full bg-red-400"></span> エラー発生`;
    }

    function hideError() {
      document.getElementById("errorAlert").classList.add("hidden");
      const indicator = document.getElementById("syncIndicator");
      indicator.className = "flex items-center gap-1 px-2 py-0.5 bg-emerald-600/30 border border-emerald-500/30 rounded-md text-emerald-200 text-[9px] font-semibold ml-2";
      indicator.innerHTML = `<span class="w-1 h-1 rounded-full bg-emerald-400 animate-pulse"></span> 同期中`;
    }

    function setupEventListeners() {
      document.getElementById("baseDate").addEventListener("change", (e) => {
        const inputVal = e.target.value;
        if (!inputVal) return;
        
        const selectedDate = new Date(inputVal.replace(/-/g, '/'));
        const mondayDate = getMondayOfWeek(selectedDate);
        const correctedDateStr = formatToJSTString(mondayDate);

        state.baseDate = correctedDateStr;
        e.target.value = correctedDateStr;
        
        fetchServerData();
      });

      document.getElementById("btnReturnToCurrent").addEventListener("click", () => {
        initBaseDate();
        document.getElementById("baseDate").value = state.baseDate;
        fetchServerData();
      });

      document.getElementById("btnReload").addEventListener("click", () => {
        fetchServerData();
      });

      document.getElementById("btnZoomIn").addEventListener("click", () => {
        if (state.zoom < 2.0) {
          state.zoom = parseFloat((state.zoom + 0.1).toFixed(1));
          updateZoomUI();
          render();
        }
      });

      document.getElementById("btnZoomOut").addEventListener("click", () => {
        if (state.zoom > 0.6) {
          state.zoom = parseFloat((state.zoom - 0.1).toFixed(1));
          updateZoomUI();
          render();
        }
      });

      document.getElementById("btnZoomReset").addEventListener("click", () => {
        state.zoom = 1.0;
        updateZoomUI();
        render();
      });
    }

    function updateZoomUI() {
      document.getElementById("zoomLevelText").textContent = Math.round(state.zoom * 100) + "%";
    }

    function setupDragScroll() {
      const container = document.getElementById("tableContainer");
      let isDown = false;
      let startX, startY, scrollLeft, scrollTop;

      container.addEventListener("mousedown", (e) => {
        if (e.target.closest("button, input, select")) return;

        isDown = true;
        container.style.cursor = "grabbing";
        
        startX = e.pageX - container.offsetLeft;
        startY = e.pageY - container.offsetTop;
        scrollLeft = container.scrollLeft;
        scrollTop = container.scrollTop;
      });

      container.addEventListener("mouseleave", () => {
        isDown = false;
        container.style.cursor = "grab";
      });

      container.addEventListener("mouseup", () => {
        isDown = false;
        container.style.cursor = "grab";
      });

      container.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();

        const x = e.pageX - container.offsetLeft;
        const y = e.pageY - container.offsetTop;
        
        const walkX = (x - startX) * 1.5;
        const walkY = (y - startY) * 1.5;

        container.scrollLeft = scrollLeft - walkX;
        container.scrollTop = scrollTop - walkY;
      });
    }

    function render() {
      renderTimetableTable(state.teachers);
    }

    function renderTimetableTable(teachers) {
      const table = document.getElementById("timetableTable");
      const thead = table.querySelector("thead");
      const tbody = table.querySelector("tbody");

      thead.innerHTML = "";
      tbody.innerHTML = "";

      if (teachers.length === 0) {
        tbody.innerHTML = `<tr><td class="p-8 text-slate-400 text-sm">該当する教員が見つかりません。</td></tr>`;
        return;
      }

      const zoom = state.zoom;
      
      const dayWidth = Math.round(20 * zoom);
      const periodWidth = Math.round(10 * zoom);
      const teacherWidth = Math.round(19.8 * zoom);
      const headerHeight = Math.round(30 * zoom);

      const dayColStyle = `width: ${dayWidth}px; min-width: ${dayWidth}px; max-width: ${dayWidth}px;`;
      const periodColStyle = `width: ${periodWidth}px; min-width: ${periodWidth}px; max-width: ${periodWidth}px;`;
      const colStyle = `width: ${teacherWidth}px; min-width: ${teacherWidth}px; max-width: ${teacherWidth}px;`;

      const headerRow = document.createElement("tr");
      headerRow.className = "bg-slate-100 text-slate-800 font-bold border-t border-b-2 border-slate-400";
      headerRow.style.height = `${headerHeight}px`;
      
      const thCorner = document.createElement("th");
      thCorner.className = `sticky top-0 left-0 bg-slate-200 z-30 border-r-2 border-slate-400 align-middle text-center`;
      thCorner.style.cssText = dayColStyle;
      thCorner.innerHTML = `<span class="font-bold" style="font-size: ${Math.max(6, 9 * zoom)}px;">曜日</span>`;
      headerRow.appendChild(thCorner);

      const thCornerPeriod = document.createElement("th");
      thCornerPeriod.className = `sticky top-0 bg-slate-200 z-30 border-r-2 border-slate-400 align-middle text-center`;
      thCornerPeriod.style.cssText = `${periodColStyle} left: ${dayWidth}px;`;
      thCornerPeriod.innerHTML = `<span class="font-bold" style="font-size: ${Math.max(6, 9 * zoom)}px;">校時</span>`;
      headerRow.appendChild(thCornerPeriod);

      teachers.forEach(tName => {
        const th = document.createElement("th");
        const tNameClean = tName.replace(/\s+/g, '');
        const isSelected = state.selectedTeacher === tNameClean;

        th.className = `sticky top-0 ${isSelected ? 'bg-rose-300' : 'bg-slate-100 hover:bg-slate-200'} z-20 border-r border-slate-400 align-top pt-0.5 text-center p-0 overflow-hidden cursor-pointer transition-colors`;
        th.style.cssText = colStyle;
        
        th.innerHTML = `
          <div class="vertical-header-text text-slate-900 font-extrabold" style="font-size: ${Math.max(8.0, 11 * zoom)}px;">
            ${tNameClean}
          </div>
        `;

        th.addEventListener("click", () => {
          state.selectedTeacher = isSelected ? null : tNameClean;
          render();
        });

        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      const days = ["月", "火", "水", "木", "金", "土"];
      const numDays = state.hasSaturday ? 6 : 5;
      const totalRows = numDays * 6;
      
      const base = new Date(state.baseDate.replace(/-/g, '/'));
      const trHeightStyle = `height: calc((100% - ${headerHeight}px) / ${totalRows});`;

      for (let d = 0; d < numDays; d++) {
        const targetDate = new Date(base);
        targetDate.setDate(base.getDate() + d);
        
        const currentMonth = targetDate.getMonth() + 1;
        const currentDay = targetDate.getDate();
        
        const specialOverrideVal = state.specialDays && state.specialDays[d];
        
        let dayLabel = days[d];
        let isSpecialDay = false;

        if (specialOverrideVal && specialOverrideVal !== "false" && specialOverrideVal !== false) {
          isSpecialDay = true;
          if (specialOverrideVal === true || specialOverrideVal === "C") {
            dayLabel = "C";
          } else {
            dayLabel = String(specialOverrideVal);
          }
        }

        const isSaturday = (d === 5);
        const dayBgClass = isSpecialDay 
          ? "bg-amber-100" 
          : (isSaturday ? "bg-indigo-200" : ((d % 2 === 0) ? "bg-blue-200" : "bg-sky-200"));

        for (let p = 1; p <= 6; p++) {
          const rowKey = `${d}-${p}`;
          const isRowSelected = state.selectedRow === rowKey;

          const tr = document.createElement("tr");
          const isDayEnd = p === 6;
          const trBorderClass = isDayEnd ? "border-b-2 border-slate-500" : "border-b border-slate-400";
          tr.className = `${trBorderClass} hover:bg-slate-50/50 transition-colors`;
          tr.style.cssText = trHeightStyle;

          if (p === 1) {
            const tdDay = document.createElement("td");
            tdDay.rowSpan = 6;
            
            const isCDay = state.specialDays[d];
            // C日課判定シートのD列で設定されたテキストのみを表示
            const cText = state.cDayTexts[d] || "";

            const dayBgClass = cText 
              ? "bg-amber-100" 
              : (isSaturday ? "bg-indigo-200" : ((d % 2 === 0) ? "bg-blue-200" : "bg-sky-200"));

            tdDay.className = `sticky left-0 ${dayBgClass} z-10 border-r-2 border-slate-400 align-middle shadow-[1px_0_3px_rgba(0,0,0,0.1)] p-0`;
            tdDay.style.cssText = dayColStyle;
            
            /* バッジ装飾を廃止し、シンプルな赤太字テキストで表示 */
            const cDayAddon = cText 
              ? `<span class="text-red-600 font-extrabold text-[10px] mt-0.5 whitespace-nowrap">【${cText}】</span>` 
              : '';

            tdDay.innerHTML = `
              <div class="flex flex-col items-center justify-center h-full text-slate-800 font-black select-none leading-none mx-auto" style="font-size: ${Math.max(8.5, (state.hasSaturday ? 11.5 : 13.5) * zoom)}px;">
                <span>${currentMonth}</span>
                <span class="mt-0.5">月</span>
                <span class="mt-0.5 tracking-tighter">${currentDay}</span>
                <span class="mt-0.5">日</span>
                <span class="${isSaturday ? 'text-indigo-950 font-bold' : 'text-blue-950'} inline-block mt-1 whitespace-nowrap">(${days[d]})</span>
                ${cDayAddon}
              </div>
            `;
            tr.appendChild(tdDay);
          }

          const tdPeriod = document.createElement("td");
          tdPeriod.className = `sticky ${isRowSelected ? 'bg-amber-300' : dayBgClass} hover:bg-amber-200 cursor-pointer z-10 font-black text-slate-800 border-r-2 border-slate-400 align-middle text-center shadow-[1px_0_3px_rgba(0,0,0,0.1)] p-0 transition-colors`;
          tdPeriod.style.cssText = `${periodColStyle} left: ${dayWidth}px;`;
          tdPeriod.title = `${days[d]}曜 ${p}時限目をハイライト`;
          tdPeriod.innerHTML = `<span style="font-size: ${Math.max(5.5, (state.hasSaturday ? 8.5 : 10) * zoom)}px;">${p}</span>`;
          
          tdPeriod.addEventListener("click", () => {
            state.selectedRow = isRowSelected ? null : rowKey;
            render();
          });

          tr.appendChild(tdPeriod);

          teachers.forEach(teacher => {
            const td = document.createElement("td");
            const teacherClean = teacher.replace(/\s+/g, '');
            const isColumnSelected = state.selectedTeacher === teacherClean;

            let bgClass = "";
            if (isColumnSelected && isRowSelected) {
              bgClass = "bg-rose-200/90 font-bold shadow-inner";
            } else if (isColumnSelected) {
              bgClass = "bg-rose-50/90 font-semibold";
            } else if (isRowSelected) {
              bgClass = "bg-amber-100/90 font-semibold";
            }

            td.className = `border-r border-slate-400 p-0 align-middle text-center cursor-pointer transition-colors ${bgClass}`;
            td.style.cssText = colStyle;

            td.addEventListener("click", () => {
              if (state.selectedTeacher === teacherClean && state.selectedRow === rowKey) {
                state.selectedTeacher = null;
                state.selectedRow = null;
              } else {
                state.selectedTeacher = teacherClean;
                state.selectedRow = rowKey;
              }
              render();
            });

            const match = state.slots.find(s => s.day === d && s.period === p && s.teacher === teacher);

            if (match) {
              const fontSizeClass = state.hasSaturday ? 7.0 : 8.0;
              const subFontSizeClass = state.hasSaturday ? 6.2 : 7.0;

              td.innerHTML = `
                <div class="flex flex-col justify-center items-center h-full w-full py-0.5 leading-[1.1]">
                  <div class="text-blue-950 font-black truncate w-full px-0 text-center tracking-[-0.08em]" style="font-size: ${Math.max(5.0, fontSizeClass * zoom)}px;" title="${match.class || ''}">
                    ${match.class || '-'}
                  </div>
                  <div class="text-slate-900 font-bold truncate w-full px-0 text-center tracking-[-0.08em]" style="font-size: ${Math.max(4.5, subFontSizeClass * zoom)}px; margin-top: ${1 * zoom}px;" title="${match.subject || ''}">
                    ${match.subject || '-'}
                  </div>
                </div>
              `;

              if (match.hasStar) {
                if (!isColumnSelected && !isRowSelected) {
                  td.style.backgroundColor = "#cbd5e1";
                }
                td.classList.add("font-bold");
              }
            } else {
              td.innerHTML = `<span class="text-slate-200 leading-none" style="font-size: ${Math.max(4.5, 8 * zoom)}px;">•</span>`;
            }
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        }
      }
    }
  </script>
</body>
</html></template>

  <template id="template-html-1"><!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>教員別週間時間割</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1a1a1a;
            --accent: #f59e0b;
            --text: #ffffff;
            --subject-normal: #ffffff;
            --subject-changed: #ffd700;
        }

        body {
            margin: 0; background-color: var(--bg); color: var(--text);
            font-family: sans-serif; display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #0a0a0a; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--accent); flex-shrink: 0;
        }

        select {
            background: #333; color: #fff; border: 1px solid var(--accent);
            padding: 8px; font-size: 1.2vw; border-radius: 4px; cursor: pointer;
        }

        .nav-buttons { display: flex; gap: 8px; }
        .nav-btn {
            background-color: #333; color: #fff; border: 1px solid var(--accent);
            padding: 5px 15px; border-radius: 4px; cursor: pointer; font-size: 1vw; font-weight: bold;
        }

        #grid-container {
            flex: 1; display: grid;
            grid-template-columns: 7vw repeat(6, 1fr);
            grid-template-rows: 6vh repeat(7, 1fr);
            gap: 6px; padding: 10px; min-height: 0;
        }

        .cell {
            background-color: var(--card); border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; min-height: 0; padding: 2px;
        }

        .header-cell { background-color: #333; font-weight: bold; flex-direction: row; gap: 5px; }
        .header-date { font-size: 1.6vw; }
        .header-day { font-size: 1.1vw; color: #aaa; }
        .period-cell { background-color: #222; font-size: 2vw; font-weight: bold; color: var(--accent); }
        
        .subject { font-size: 1.5vw; font-weight: bold; line-height: 1.2; }
        .subject.normal { color: var(--subject-normal); }
        .subject.changed { color: var(--subject-changed); }
        
        .class-name { font-size: 1.1vw; color: #aaa; margin-top: 4px; }
        .is-today { background-color: #1e293b; box-shadow: inset 0 0 0 2px var(--accent); }
        
        #clock { font-size: 1.4vw; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:20px;">
        <select id="teacher-select" onchange="render()">
            <option value="">教員を選択してください</option>
        </select>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="updateWeek(-1)">前週</button>
            <button class="nav-btn" onclick="resetWeek()">今週</button>
            <button class="nav-btn" onclick="updateWeek(1)">次週</button>
        </div>
    </div>
    <div id="clock"></div>
</header>

<div id="grid-container"></div>

<script>
const CONFIG = {
    spreadsheetId: '17qPt1vJEMiE2I9SXRSHpPyyQFRJhwx2q0QWOGYRz3Oc',
    sheetName: 'data',
    teacherSheetName: '教員リスト'
};

let masterData = [];
let weekOffset = 0;
const dayLabels = ['日', '月', '火', '水', '木', '金', '土'];

function parseDateTo8DigitKey(val) {
    if (!val) return '';
    const str = String(val).trim();

    const gvizMatch = str.match(/Date\((\d+),\s*(\d+),\s*(\d+)/i);
    if (gvizMatch) {
        const y = gvizMatch[1];
        const m = String(parseInt(gvizMatch[2], 10) + 1).padStart(2, '0');
        const d = String(parseInt(gvizMatch[3], 10)).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    const partsMatch = str.match(/(\d{4})[\/\-\.\s年]?(\d{1,2})[\/\-\.\s月]?(\d{1,2})/);
    if (partsMatch) {
        const y = partsMatch[1];
        const m = String(parseInt(partsMatch[2], 10)).padStart(2, '0');
        const d = String(parseInt(partsMatch[3], 10)).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    const digits = str.replace(/\D/g, '');
    if (digits.length === 8) return digits;
    return '';
}

function fetchSheetJsonp(sheetName) {
    return new Promise((resolve, reject) => {
        const callbackName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
        
        window[callbackName] = function(json) {
            delete window[callbackName];
            const script = document.getElementById(callbackName);
            if (script) script.remove();
            
            if (!json || !json.table || !json.table.rows) {
                resolve([]);
                return;
            }
            
            const rows = json.table.rows.map(row => {
                if (!row.c) return [];
                return row.c.map(cell => {
                    if (!cell) return "";
                    if (cell.f !== null && cell.f !== undefined) return cell.f;
                    if (cell.v !== null && cell.v !== undefined) return cell.v;
                    return "";
                });
            });
            resolve(rows);
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.spreadsheetId}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
        script.onerror = (err) => {
            delete window[callbackName];
            if (script) script.remove();
            reject(err);
        };
        document.body.appendChild(script);
    });
}

async function init() {
    await Promise.all([loadTeachers(), loadSchedule()]);
}

async function loadTeachers() {
    try {
        const rows = await fetchSheetJsonp(CONFIG.teacherSheetName);
        const select = document.getElementById('teacher-select');
        
        rows.forEach(row => {
            const name = String(row[0] || "").trim();
            const subject = String(row[1] || "").trim();
            
            if (!name) return;
            const option = document.createElement('option');
            option.value = name;
            option.textContent = subject ? `[${subject}] ${name}` : name;
            select.appendChild(option);
        });
    } catch (err) {
        console.error("教員リスト取得エラー:", err);
    }
}

async function loadSchedule() {
    try {
        const [rows, cDayRows] = await Promise.all([
            fetchSheetJsonp(CONFIG.sheetName),
            fetchSheetJsonp('C日課判定')
        ]);

        window.cDayMap = {};
        if (Array.isArray(cDayRows)) {
            cDayRows.forEach(row => {
                const rawDateStr = String(row[0] || "").trim();
                const textVal = String(row[3] || "").trim();
                const dateKey = parseDateTo8DigitKey(rawDateStr);
                if (dateKey && textVal) {
                    window.cDayMap[dateKey] = textVal;
                }
            });
        }

        const dataRows = (rows.length > 0 && String(rows[0][3] || "").includes("時限")) ? rows.slice(1) : rows;

        masterData = dataRows.map(row => {
            const colD = String(row[3] || "").trim();
            const periodMatch = colD.match(/\d+/);
            const period = periodMatch ? parseInt(periodMatch[0]) : null;

            return {
                isChanged: String(row[1] || "").trim() === "☆",
                dateKey: parseDateTo8DigitKey(row[2]),
                period: period,
                className: String(row[4] || "").trim(),
                subject: String(row[5] || "").trim(),
                teachers: row.slice(11, 26).map(t => String(t || "").trim())
            };
        }).filter(item => item.dateKey && item.period);
    } catch (err) {
        console.error("時間割データ取得エラー:", err);
    }
}

function render() {
    const targetTeacher = document.getElementById('teacher-select').value;
    const container = document.getElementById('grid-container');
    const clock = document.getElementById('clock');
    
    const now = new Date();
    clock.innerText = now.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });

    if (!targetTeacher) { 
        container.innerHTML = ""; 
        return; 
    }

    const startOfWeek = new Date();
    const dayIdx = startOfWeek.getDay();
    const diff = (dayIdx === 0 ? -6 : 1 - dayIdx) + (weekOffset * 7);
    startOfWeek.setDate(startOfWeek.getDate() + diff);
    startOfWeek.setHours(0,0,0,0);

    let html = '<div class="cell header-cell">時限</div>';
    const weekKeys = [];

    for (let i = 0; i < 6; i++) {
        const d = new Date(startOfWeek);
        d.setDate(startOfWeek.getDate() + i);
        
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        const key = `${year}${month}${date}`;
        weekKeys.push(key);
        
        const cDayText = (window.cDayMap && window.cDayMap[key]) ? window.cDayMap[key] : '';
        const dayLabel = dayLabels[d.getDay()];
        const isToday = d.toDateString() === now.toDateString();
        
        html += `
            <div class="cell header-cell ${isToday ? 'is-today' : ''}">
                <span class="header-date">${d.getMonth() + 1}/${d.getDate()}</span>
                <span class="header-day">(${dayLabel})</span>
                ${cDayText ? `<span style="font-size:0.8vw; background:#f59e0b; color:#000; padding:1px 4px; border-radius:3px; font-weight:bold;">${cDayText}</span>` : ''}
            </div>
        `;
    }

    for (let p = 1; p <= 7; p++) {
        html += `<div class="cell period-cell">${p}</div>`;
        weekKeys.forEach(key => {
            // 後ろ（最新行）優先で検索
            const match = masterData.slice().reverse().find(item => 
                item.dateKey === key && 
                item.period === p && 
                item.teachers.includes(targetTeacher)
            );
            
            let content = "";
            if (match) {
                const classAttr = match.isChanged ? 'subject changed' : 'subject normal';
                const displayText = match.isChanged ? '☆' + match.subject : match.subject;
                content = `
                    <div class="${classAttr}">${displayText}</div>
                    <div class="class-name">${match.className}</div>
                `;
            }
            html += `<div class="cell">${content}</div>`;
        });
    }
    container.innerHTML = html;
}

function updateWeek(v) { weekOffset += v; render(); }
function resetWeek() { weekOffset = 0; render(); }
window.onload = init;
</script>
</body>
</html></template>

                const y = gvizMatch[1];

                return `${y}${m}${d}`;

            const partsMatch = str.match(/(\d{4})[\/\-\.\s年]?(\d{1,2})[\/\-\.\s月]?(\d{1,2})/);

                return `${y}${m}${d}`;
            }

            const digits = str.replace(/\D/g, '');
            if (digits.length === 8) return digits;
            return '';
        }

        function fetchSheetJsonp(sheetName) {
            return new Promise((resolve, reject) => {
                const callbackName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
                
                window[callbackName] = function(json) {
                    delete window[callbackName];
                    const script = document.getElementById(callbackName);
                    if (script) script.remove();
                    
                    if (!json || !json.table || !json.table.rows) {
                        resolve([]);
                        return;
                    }
                    
                    const rows = json.table.rows.map(row => {
                        if (!row.c) return [];
                        return row.c.map(cell => {
                            if (!cell) return "";
                            if (cell.f !== null && cell.f !== undefined) return cell.f;
                            if (cell.v !== null && cell.v !== undefined) return cell.v;
                            return "";
                        });
                    });
                    resolve(rows);
                };

                const script = document.createElement('script');
                script.id = callbackName;
                script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.spreadsheetId}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
                script.onerror = (err) => {
                    delete window[callbackName];
                    if (script) script.remove();
                    reject(err);
                };
                document.body.appendChild(script);
            });
        }

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            syncDatePicker();
            await fetchSpreadsheetData();
        }

        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const day = dayLabels[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('clock-display').innerText = `${year}/${month}/${date} (${day}) ${hours}:${minutes}`;

        function syncDatePicker() {
            const yyyy = currentDate.getFullYear();
            const mm = String(currentDate.getMonth() + 1).padStart(2, '0');

            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        async function fetchSpreadsheetData() {
            try {
                /* C日課判定シートのD列のみを参照するように修正 */
                const [rows, cDayRows] = await Promise.all([
                    fetchSheetJsonp(CONFIG.sheetName),
                    fetchSheetJsonp('C日課判定')
                ]);

                const cDayMap = {};
                if (Array.isArray(cDayRows)) {
                    cDayRows.forEach(row => {
                        const rawDateStr = String(row[0] || "").trim();
                        const textVal = String(row[3] || "").trim(); // D列
                        const dateKey = parseDateTo8DigitKey(rawDateStr);
                        if (dateKey && textVal) {
                            cDayMap[dateKey] = textVal;
                        }
                    });
                }

                if (!rows || rows.length === 0) {
                    masterData = [];
                    renderAll();
                    return;
                }

                const dataRows = (rows.length > 0 && String(rows[0][3] || "").includes("時限")) ? rows.slice(1) : rows;

                masterData = dataRows.map(row => {
                    const starMark = String(row[1] || "").trim();
                    const dateVal  = String(row[2] || "").trim();
                    const colD     = String(row[3] || "").trim();
                    const className= String(row[4] || "").trim();
                    const subject  = String(row[5] || "").trim();

                    const roomVal  = [row[7], row[8], row[9]]
                        .map(r => String(r || "").trim())
                        .filter(Boolean)
                        .join(" ");

                    const periodMatch = colD.match(/\d+/);
                    const period = periodMatch ? parseInt(periodMatch[0]) : null;

                    return {
                        dateKey: parseDateTo8DigitKey(dateVal),
                        period: period,
                        className: className,
                        subject: subject,
                        room: roomVal,
                        isChanged: starMark === "☆"
                    };
                }).filter(item => item.dateKey && item.period && item.className && item.subject);

                window.globalCDayMap = cDayMap;

                renderAll();
            } catch (err) {
                console.error("Data Load Error:", err);
            }
        }

        function renderAll() {
            const targetKey = getDateKey(currentDate);

            // C日課判定シートのD列（index 3）に設定されているテキストのみを参照
            const cTextFromMap = window.globalCDayMap ? window.globalCDayMap[targetKey] : '';

            const dayName = dayLabels[currentDate.getDay()];
            const cTag = cTextFromMap ? `<span class="c-tag-highlight">【${cTextFromMap}】</span>` : '';

            Object.keys(GRADE_CONFIG).forEach(gradeKey => {
                const config = GRADE_CONFIG[gradeKey];
                const container = document.getElementById(`grid-${gradeKey}`);
                const tagEl = document.getElementById(`tag-${gradeKey}`);

                tagEl.innerHTML = `${currentDate.getMonth() + 1}/${currentDate.getDate()} (${dayName}曜) ${cTag}`;

                container.style.gridTemplateColumns = `minmax(2rem, 2.5rem) repeat(${config.classes.length}, 1fr)`;

                let html = '<div class="cell header-cell">時</div>';
                config.classes.forEach(cls => {
                    html += `<div class="cell header-cell">${cls}</div>`;
                });

                for (let p = 1; p <= 6; p++) {
                    html += `<div class="cell period-cell">${p}</div>`;
                    config.classes.forEach(cls => {
                        // シートの下部（最新行）を優先して取得
                        const match = masterData.slice().reverse().find(item => 
                            item.dateKey === targetKey && 
                            item.period === p && 
                            item.className === cls
                        );

                        if (match) {
                            const clsName = match.isChanged ? 'subject-changed' : 'subject-normal';
                            const star = match.isChanged ? '☆' : '';
                            const roomBadge = match.room ? `<div class="room-text">${match.room}</div>` : '';
                            
                            html += `
                                <div class="cell">
                                    <div class="subject-text ${clsName}">${star}${match.subject}</div>
                                    ${roomBadge}
                                </div>
                            `;
                        } else {
                            html += `<div class="cell empty-cell">-</div>`;
                        }
                    });
                }
                container.innerHTML = html;
            });
        }

        function adjustDate(offset) {
            currentDate.setDate(currentDate.getDate() + offset);
            syncDatePicker();
            renderAll();
        }

        function setToday() {
            currentDate = new Date();
            syncDatePicker();
            renderAll();
        }

        function onDatePicked() {
            const val = document.getElementById('date-picker').value;
            if (val) {
                currentDate = new Date(val + 'T00:00:00');
                renderAll();
            }
        }

        window.onload = init;
    </script>
</body>
</html></template>

        function extract2DArray(rows) {
            return rows.map(row => {
                if (!row || !row.c) return [];
                return row.c.map(cell => {
                    if (!cell) return "";
                    if (cell.f !== null && cell.f !== undefined) return String(cell.f);
                    if (cell.v !== null && cell.v !== undefined) return String(cell.v);
                    return "";
                });
            });
        }

        function normalizeDateStr(y, m, d) {
            const year = String(y);
            const month = String(m).padStart(2, '0');
            const day = String(d).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function init() {
            try {
                const [dataRows, roomRows, cDayRows] = await Promise.all([
                    fetchSpreadsheetRows(CONFIG.dataSheetName),
                    fetchSpreadsheetRows(CONFIG.roomSheetName),
                    fetchSpreadsheetRows('C日課判定')
                ]);

                window.roomCDayMap = {};
                if (Array.isArray(cDayRows)) {
                    cDayRows.forEach(row => {
                        const rawDateStr = String(row[0] || "").trim();
                        const textVal = String(row[3] || "").trim();
                        const dateKey = parseDateTo8DigitKey(rawDateStr);
                        if (dateKey && textVal) {
                            window.roomCDayMap[dateKey] = textVal;
                        }
                    });
                }

                masterData = [];
                dataRows.forEach(row => {
                    if (!row || row.length < 5) return;

                    const starMark  = String(row[1] || "").trim();
                    const dateVal   = String(row[2] || "").trim();
                    const periodStr = String(row[3] || "").trim();
                    const periodMatch = periodStr.match(/\d+/);
                    const period = periodMatch ? parseInt(periodMatch[0], 10) : null;
                    const dateKey = parseDateTo8DigitKey(dateVal);

                    if (dateKey && period) {
                        const teachers = row.slice(11, 26)
                            .map(t => String(t || "").trim())
                            .filter(t => t !== "");

                        const rooms = [row[7], row[8], row[9]]
                            .map(r => String(r || "").trim())
                            .filter(r => r !== "");

                        masterData.push({
                            isChanged: starMark === "☆" || starMark.includes("☆"),
                            dateKey: dateKey,
                            period: period,
                            className: String(row[4] || "").trim(),
                            subject: String(row[5] || "").trim(),
                            teacher: teachers.join(' / '),
                            rooms: rooms
                        });
                    }
                });

                roomList = [];
                if (roomRows && roomRows.length > 0) {
                    roomRows.forEach(r => {
                        const roomName = String(r[0] || "").trim();
                        if (roomName && roomName !== "部屋名" && roomName !== "部屋") {
                            roomList.push(roomName);
                        }
                    });
                }

                if (roomList.length === 0) {
                    const roomSet = new Set();
                    masterData.forEach(d => d.rooms.forEach(r => roomSet.add(r)));
                    roomList = Array.from(roomSet).sort();
                }

                const select = document.getElementById('room-select');
                select.innerHTML = '<option value="">部屋を選択</option>';
                roomList.forEach(room => {
                    const opt = document.createElement('option');
                    opt.value = room;
                    opt.textContent = room;
                    select.appendChild(opt);
                });

                if (roomList.length > 0) {
                    select.value = roomList[0];
                }

                autoSetInitialWeek();
                render();
            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('header-title').innerText = "接続エラー";
            }
        }

        function autoSetInitialWeek() {
            if (masterData.length === 0) return;
            const now = new Date();
            const todayKey = normalizeDateStr(now.getFullYear(), now.getMonth() + 1, now.getDate());

            const sortedKeys = Array.from(new Set(masterData.map(d => d.dateKey))).sort();
            const futureKey = sortedKeys.find(k => k >= todayKey) || sortedKeys[sortedKeys.length - 1];

            if (futureKey) {
                const parts = futureKey.split('-');
                const targetDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                
                const nowDay = now.getDay();
                const nowStart = new Date(now);
                nowStart.setDate(now.getDate() - (nowDay === 0 ? 6 : nowDay - 1));
                nowStart.setHours(0,0,0,0);

                const targetDay = targetDate.getDay();
                const targetStart = new Date(targetDate);
                targetStart.setDate(targetDate.getDate() - (targetDay === 0 ? 6 : targetDay - 1));
                targetStart.setHours(0,0,0,0);

                const diffMs = targetStart.getTime() - nowStart.getTime();
                weekOffset = Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
            }
        }

        function render() {
            const targetRoom = document.getElementById('room-select').value;
            const container = document.getElementById('grid-container');
            const now = new Date();
            
            document.getElementById('current-clock').innerText = now.toLocaleDateString('ja-JP', { 
                month:'long', day:'numeric', weekday:'short' 
            });

            if (!targetRoom) {
                container.innerHTML = '<div style="grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; font-size: 1.5vw; color: #666;">部屋を選択してください</div>';
                return;
            }

            const startOfWeek = new Date();
            const dayIdx = startOfWeek.getDay();
            const diff = (dayIdx === 0 ? -6 : 1 - dayIdx) + (weekOffset * 7);
            startOfWeek.setDate(startOfWeek.getDate() + diff);
            startOfWeek.setHours(0,0,0,0);

            let html = '<div class="cell header-cell"><div class="header-date" style="font-size:1.2vw">時限</div></div>';
            const weekKeys = [];

            for (let i = 0; i < 6; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                
                const key = normalizeDateStr(d.getFullYear(), d.getMonth() + 1, d.getDate());
                weekKeys.push(key);

                // 日付キー（YYYYMMDD形式に変換）でC日課判定シートのD列の値を検索
                const rawKey = key.replace(/-/g, '');
                const cDayText = (window.roomCDayMap && (window.roomCDayMap[key] || window.roomCDayMap[rawKey])) ? (window.roomCDayMap[key] || window.roomCDayMap[rawKey]) : '';
                const dayLabel = dayLabels[d.getDay()];
                const isToday = d.toDateString() === now.toDateString();
                
                html += `
                    <div class="cell header-cell ${isToday ? 'is-today' : ''}">
                        <span class="header-date">${d.getMonth() + 1}/${d.getDate()}</span>
                        <span class="header-day">(${dayLabel})</span>
                        ${cDayText ? `<span style="font-size:0.8vw; background:#a855f7; color:#fff; padding:1px 4px; border-radius:3px; font-weight:bold;">${cDayText}</span>` : ''}
                    </div>
                `;
            }

            for (let p = 1; p <= 7; p++) {
                html += `<div class="cell period-cell">${p}</div>`;
                weekKeys.forEach(key => {
                    // 最新行（後勝）優先でマッチ
                    const match = masterData.slice().reverse().find(item => 
                        item.dateKey === key && 
                        item.period === p && 
                        item.rooms.includes(targetRoom)
                    );

                    let content = '';
                    if (match) {
                        const classAttr = match.isChanged ? 'subject changed' : 'subject normal';
                        const text = match.isChanged ? '☆' + match.subject : match.subject;
                        content = `
                            <div class="${classAttr}">${text}</div>
                            <div class="info-row">
                                <div class="class-name">${match.className}</div>
                                <div class="teacher-name" title="${match.teacher}">${match.teacher}</div>
                            </div>
                        `;
                    }
                    html += `<div class="cell">${content}</div>`;
                });
            }
            container.innerHTML = html;
        }

        function updateWeek(val) { weekOffset += val; render(); }
        function resetWeek() { weekOffset = 0; render(); }
        window.onload = init;
    </script>
</body>
</html></template>

  <script>
    let activeTabIndex = 0;
    const loadedIframes = [false, false, false, false];

    function loadTabContent(index) {
      if (loadedIframes[index]) return;
      
      const iframe = document.getElementById(`iframe-${index}`);
      const template = document.getElementById(`template-html-${index}`);
      
      if (iframe && template) {
        iframe.srcdoc = template.innerHTML;
        loadedIframes[index] = true;
      }
    }

    function switchTab(index) {
      activeTabIndex = index;

      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`tab-btn-${i}`);
        const panel = document.getElementById(`tab-panel-${i}`);

        if (i === index) {
          btn.classList.add('active');
          panel.classList.remove('hidden');
          loadTabContent(i);
        } else {
          btn.classList.remove('active');
          panel.classList.add('hidden');
        }
      }
    }

    /**
     * 現在アクティブなタブ画面（またはコンテナ）を全画面化（Fullscreen API）
     */
    function toggleFullscreen() {
      const activePanel = document.getElementById(`tab-panel-${activeTabIndex}`);
      if (!activePanel) return;

      if (!document.fullscreenElement) {
        if (activePanel.requestFullscreen) {
          activePanel.requestFullscreen();
        } else if (activePanel.webkitRequestFullscreen) { /* Safari */
          activePanel.webkitRequestFullscreen();
        } else if (activePanel.msRequestFullscreen) { /* IE11 */
          activePanel.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      switchTab(0); // 初期タブ（教員週間一覧）を表示
    });
  </script>
</body>
